apiVersion: v1
kind: Secret
metadata:
  name: {{ .Chart.Name }}-secret
  labels:
    {{- include "compiler.labels" . | nindent 4 }}
data:
  spring.datasource.url: {{ .Values.global.db.url | b64enc }}
  spring.datasource.password: {{ .Values.global.db.password | b64enc }}
  spring.datasource.username: {{ .Values.global.db.username | b64enc }}
