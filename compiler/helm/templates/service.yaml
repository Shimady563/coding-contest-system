apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
  labels:
    {{- include "compiler.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "compiler.selectorLabels" . | nindent 4 }}
  ports:
    - name: compiler
      protocol: TCP
      port: {{ .Values.compiler.server.externalPort }}
      targetPort: {{ .Values.compiler.server.internalPort }}