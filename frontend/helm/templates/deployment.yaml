apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      {{- include "frontend.selectorLabels" . | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "frontend.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.global.serviceAccount }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ .Values.frontend.dockerImageName }}:{{ .Values.global.dockerTag }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: frontend
              protocol: TCP
              containerPort: {{ .Values.frontend.internalPort }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.frontend.internalPort }}
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.frontend.internalPort }}
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 10
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ .Chart.Name }}-config