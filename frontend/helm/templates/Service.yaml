apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Chart.Namespace }}
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "frontend.selectorLabels" . | nindent 4 }}
  ports:
    - name: Frontend
      protocol: TCP
      port: {{ .Values.frontend.externalPort }}
      targetPort: {{ .Values.frontend.internalPort }}