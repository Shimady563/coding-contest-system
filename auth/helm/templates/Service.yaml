apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Chart.Namespace }}
  labels:
    {{- include "auth.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "auth.selectorLabels" . | nindent 4 }}
  ports:
    - name: Auth
      protocol: TCP
      port: {{ .Values.auth.server.externalPort }}
      targetPort: {{ .Values.auth.server.internalPort }}