auth:
  replicas: 1
  dockerImageName: coding-contest-manager
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi

  profiles: prod

  server:
    basePath: /api/v1/
    port: 8080

  whitelist: /groups, /actuator, /actuator/**
  allowedOrigins: https://coding-contest.k-lab.su, http://coding-contest.k-lab.su, https://192.168.0.38:30443, http://192.168.0.38:30443

  logLevel:
    base: INFO
    manager: INFO
