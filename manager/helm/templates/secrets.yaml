apiVersion: v1
kind: Secret
metadata:
  name: {{ .Chart.Name }}-secret
  labels:
    {{- include "manager.labels" . | nindent 4 }}
data:
  SPRING_DATASOURCE_URL: {{ .Values.global.db.url | b64enc }}
  SPRING_DATASOURCE_USERNAME: {{ .Values.global.db.username | b64enc }}
  SPRING_DATASOURCE_PASSWORD: {{ .Values.global.db.password | b64enc }}

  SPRING_KAFKA_BOOTSTRAP_SERVERS: {{ .Values.global.kafka.servers | b64enc }}

  JWT_TOKEN_ACCESS_SECRET: {{ .Values.global.jwt.access.secret | b64enc }}
  JWT_TOKEN_ACCESS_EXPIRATION: {{ .Values.global.jwt.access.expiration | b64enc }}
  JWT_TOKEN_ACCESS_COOKIE_NAME: {{ .Values.global.jwt.access.cookieName | b64enc }}
