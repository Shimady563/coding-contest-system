apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "compiler.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.compiler.replicas }}
  selector:
    matchLabels:
      {{- include "compiler.selectorLabels" . | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "compiler.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.global.serviceAccount }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ .Values.compiler.dockerImageName }}:{{ .Values.global.dockerTag }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: compiler
              protocol: TCP
              containerPort: {{ .Values.compiler.server.internalPort }}
          readinessProbe:
            httpGet:
              path: {{ .Values.compiler.server.basePath }}/actuator/health/readiness
              port: {{ .Values.compiler.server.externalPort }}
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: {{ .Values.compiler.server.basePath }}/actuator/health/liveness
              port: {{ .Values.compiler.server.externalPort }}
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 10
          resources:
            {{- toYaml .Values.compiler.resources | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ .Chart.Name }}-config
            - secretRef:
                name: {{ .Chart.Name }}-secret