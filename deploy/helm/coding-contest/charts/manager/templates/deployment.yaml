apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "manager.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.manager.replicas }}
  selector:
    matchLabels:
      {{- include "manager.selectorLabels" . | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "manager.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.global.serviceAccount }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ .Values.manager.dockerImageName }}:{{ .Values.global.dockerTag }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: manager
              protocol: TCP
              containerPort: {{ .Values.manager.server.internalPort }}
          readinessProbe:
            httpGet:
              path: {{ .Values.manager.server.basePath }}/actuator/health/readiness
              port: {{ .Values.manager.server.externalPort }}
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: {{ .Values.manager.server.basePath }}/actuator/health/liveness
              port: {{ .Values.manager.server.externalPort }}
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 10
          resources:
          envFrom:
            - configMapRef:
                name: {{ .Chart.Name }}-config
            - secretRef:
                name: {{ .Chart.Name }}-secret